services:
  routerdeck:
    build: .
    container_name: routerdeck
    restart: unless-stopped
    environment:
      PORT: ${PORT:-8080}
      TZ: ${TZ:-Asia/Jakarta}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      APP_SECRET: ${APP_SECRET:?Set APP_SECRET in .env}
      DB_PATH: ${DB_PATH:-/data/routerdeck.db}
      POLL_INTERVAL_MS: ${POLL_INTERVAL_MS:-15000}
      UPTIME_INTERVAL_MS: ${UPTIME_INTERVAL_MS:-30000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      RUIJIE_API_TOKEN: ${RUIJIE_API_TOKEN:-}
      RUIJIE_CLOUD_CACHE_MS: ${RUIJIE_CLOUD_CACHE_MS:-120000}
      RUIJIE_CLOUD_STALE_MS: ${RUIJIE_CLOUD_STALE_MS:-1800000}
      RUIJIE_RATE_LIMIT_BACKOFF_MS: ${RUIJIE_RATE_LIMIT_BACKOFF_MS:-300000}
      RUIJIE_INVENTORY_CACHE_SECONDS: ${RUIJIE_INVENTORY_CACHE_SECONDS:-900}
      GATEWAY_ANALYTICS_TTL_MS: ${GATEWAY_ANALYTICS_TTL_MS:-15000}
    ports:
      - "8080:8080"
    volumes:
      - routerdeck-data:/data
    networks:
      - routerdeck

volumes:
  routerdeck-data:

networks:
  routerdeck:
    driver: bridge
